  dtype: float32

semantic_schema:
  hidden_old_lexical_value: true
  operation_label_visible: false
  oracle_erase_write_visible: false
  exact_mask_visible: false
  gate_encoder_fields:
    - prior_valid_to_day
    - observation_day
    - evidence_valid_from_day
    - evidence_valid_to_day
    - evidence_version
    - prior_version
    - current_relation
    - scope
  gate_forbidden_sources:
    - operation
    - derive_operation
    - derive_raw_demand
    - erase
    - write
    - demand
    - target
    - target_state
    - exact_mask
    - affected_index
    - state
    - state_read
    - address
    - old_value
    - old_value_token
    - new_value
    - incoming_value_token
    - entity_description
    - domain
    - incoming_evidence
    - evidence_timestamp_day
    - prior_valid_from_day
    - source
    - provenance
    - template_surface
    - namespace
    - numeric_seed
  banned_surface_cues:
    - add
    - delete
    - revoke
    - invalidate
    - replace
    - supersede

feature_encoder:
  name: fixed_relational_semantic_encoder_r1
  dimension: 6
  ordered_features:
    - prior_valid_to_minus_observation_over_32
    - evidence_valid_from_minus_observation_over_32
    - evidence_valid_to_minus_observation_over_32
    - evidence_version_minus_prior_version_over_4
    - evidence_scope_equals_current_scope
    - evidence_scope_differs_from_current_scope
  day_scale: 32.0
  version_scale: 4.0
  numeric_transform: raw_signed_continuous_no_clipping_no_threshold
  scope_transform: equality_partition_one_hot
  fitted_state: none
  frozen: true

data_generation:
  operation_is_private_scoring_metadata: true
  relational_predicates_determine_private_operation: true
  absolute_day_and_version_translation_randomized: true
  nuisance_fields_generated_from_independent_hash_streams: true
  write_time_regimes: [active, expired, future]
  write_version_regimes: [positive, nonpositive]
  write_scope_regimes: [same, different]
  excluded_write_false_tuple: [active, positive, same]
  feasible_write_false_strata: 11
  every_preserve_and_invalidate_cell_balances_all_write_false_strata: true
  count_per_cell_must_be_divisible_by_write_false_strata: true
  train_validation_entity_old_new_vocab_intersection: empty

model:
  path_hidden_dim: 64
  hidden_layers: 2
  activation: gelu
  gate_activation: sigmoid
  factorized_route: identity
  shared_route: rank_one_average
  identical_parameter_tensors: true
  identical_dense_compute_graph: true
  common_initialization: true

training:
  steps: 2400
  dry_steps: 320
  batch_size: 128
  learning_rate: 0.002
  weight_decay: 0.0
  gradient_clip_norm: 1.0
  affected_read_weight: 1.0
  unaffected_retention_weight: 1.0
  target_state_weight: 0.0
  checkpoint_selection: fixed_final_step

