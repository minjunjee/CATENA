  transaction_score_gain_min: 0.02
  positive_seed_count_required: 5
structural_spill_gate:
  target_exact_headroom_fraction_min: 0.90
  worst_active_non_target_degradation_min: 0.01
  min_seed_count_same_direction: 4
registered_dispositions:
  - GATE_POLICY_BOTTLENECK
  - ADDRESS_LOCALIZATION_BOTTLENECK
  - CANDIDATE_RECOVERY_BOTTLENECK
