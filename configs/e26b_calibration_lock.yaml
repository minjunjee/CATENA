schema_version: catena-v8.1
experiment: e26b_lm_calibration
stage: CALIBRATION_AND_LOCK
dependency:
  experiment: e26a_operator_data_gate
  required_disposition: GO_E26B
scientific_evidence: false
claim_ceiling: CALIBRATION_ONLY
variants: [projected_tied_delta_lm, dual_delta_lm]
paired_seed: 26000
calibration_tokens_min: 50000000
calibration_tokens_max: 80000000
data_mix:
  general_language_fraction: 0.80
  transactional_fraction: 0.20
optimizer_candidate:
  name: AdamW
  learning_rate: 3.0e-4
  betas: [0.9, 0.95]
  weight_decay: 0.1
  grad_clip_norm: 1.0
  scheduler: cosine
  warmup_fraction: 0.01
  target_global_batch_tokens: 65536
selection:
  allowed_model_candidate_ids: [d512_ctx4096, d512_ctx2048, d448_ctx4096]
  allowed_main_tokens: [250000000, 300000000, 400000000, 500000000]
  use_main_test_for_selection: false
  fixed_checkpoint_rule: exact_final_token_count
calibration_go:
  exact_minus_stale_score_min_each_primary_operation: 0.10
  both_general_ppl_finite: true
  unexplained_relative_ppl_gap_max: 0.05
  no_state_explosion: true
  no_divergence: true
  matching_all_pass: true
  projected_schedule_feasible: true
lock_outputs:
  - model_config
  - tokenizer_hash
  - general_corpus_hash
  - global_batch_tokens
  - optimizer_schedule
  - main_tokens_per_model
  - paired_seed_list
  - benchmark_manifest_hash
  - metric_weights
  - sesoi_and_guardrail_margins
  - checkpoint_rule
  - gpu_wave_schedule
registered_dispositions:
  - GO_E26C
  - NO_GO_CALIBRATION_FLOOR
  - NO_GO_TRAINING_STABILITY
  - NO_GO_MATCHING
  - NO_GO_ETA
  - BLOCKED_DEPENDENCY
