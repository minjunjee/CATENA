  separate_environment_required: true
  scientific_replication_requires_explicit_flag: true
environment:
  required_prefix: ${CATENA_E25A_ENV_PREFIX}
backend:
  name: gdn2_kda_official_e25a
  repo_path: ${CATENA_GDN2_REPO}
  expected_commit: 95709fc250357c2dd109361c353192f2aa5913f9
  remote_url: https://github.com/NVlabs/GatedDeltaNet-2.git
  license_path: LICENSE
  license_sha256: eaff393a7abc4ea7cb05795423b531a212b6d2189bcbe30410587d52d70988bb
  fla_repo_path: ${CATENA_FLA_REPO}
  fla_expected_commit: 4b02d15d6a68700181b180235be62a9fb95d2a38
