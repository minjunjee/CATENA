  checks:
    full_sequence_chunked_fp32:
      metric_key: full_chunked_fp32_relative_l2
      comparison: le
      threshold: 1.0e-5
    tied_reduction_kda_fp32:
      metric_key: tied_kda_fp32_relative_l2
      comparison: le
      threshold: 1.0e-5
    bf16_parity:
      metric_key: bf16_relative_l2
      comparison: le
      threshold: 5.0e-3
    backward_finite:
      metric_key: backward_all_finite
      comparison: eq
      expected: true
    state_carry_clone_restore:
      metric_key: state_carry_clone_restore
      comparison: eq
      expected: true
    intervention_hook_confinement:
      metric_key: intervention_hook_confined
      comparison: eq
      expected: true
replication:
  plugin_module: catena_official_plugins.e25a_replication
  plugin_source_path: src/catena_official_plugins/e25a_replication.py
  plugin_source_sha256: d60f98aa215e448a7d4ae75b3d000a8a95e98d561c4f1191be6c1b6ce7c111b7
  required_gate_experiment_id: e25a_official_gdn2_gate
  explicit_safe_e22b_report_env: CATENA_E25A_E22B_REPORT
  subsets:
    [e02b_magnitude_factorization, e18_magnitude_sequence, e22_locality_if_supported]
  e18_evaluation_batches: 2
  e18_evaluation_batch_size: 32
  source_tensor_contract:
    e02b_config: configs/e02b_prospective_absolute_supersede.yaml
    e18_config: configs/e18a_sequence_control_lattice.yaml
    e22_config: configs/e22b_active_path_locality.yaml
    e22_experiment_id: e22b_active_path_locality
claim_boundary:
