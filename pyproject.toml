[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "catena-realm"
version = "0.6.0"
description = "Baseline research code for CATENA transaction-conditioned state transport experiments"
readme = "README.md"
requires-python = ">=3.11,<3.14"
authors = [{name = "CATENA Research Team"}]
dependencies = [
  "PyYAML>=6.0.2",
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
  "rich>=13.9,<15",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "scipy>=1.14,<2",
  "scikit-learn>=1.6,<2",
  "pyarrow>=18,<24",
  "jsonlines>=4,<5",
  "psutil>=6,<8",
  "nvidia-ml-py>=12,<14",
  "safetensors>=0.5,<1",
  "tqdm>=4.67,<5",
]

[project.optional-dependencies]
models = [
  "transformers>=4.48,<6",
  "accelerate>=1.2,<3",
  "datasets>=3.2,<5",
  "sentencepiece>=0.2,<1",
  "tokenizers>=0.21,<1",
  "huggingface-hub>=0.28,<2",
  "rwkv>=0.8.28,<1",
]
train = [
  "tensorboard>=2.18,<3",
  "wandb>=0.19,<1",
]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
]

[project.scripts]
catena = "catena.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
